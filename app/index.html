<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코디엠 성경통독</title>
<meta name="theme-color" content="#163F73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코디엠 통독">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FC; --surface:#FFFFFF; --ink:#132C48; --soft:#5A7390;
  --blue:#1F5FA8; --deep:#163F73; --sky:#DCE8F6; --line:#CFDCEB;
  --water:#3E86CF; --water2:#7FB2E5; --rest:#EEF2F7;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A28; --surface:#152536; --ink:#E6EEF7; --soft:#9DB2C9;
    --blue:#6FA8E6; --deep:#A9CCF2; --sky:#1C3550; --line:#27405C;
    --water:#3B7CC0; --water2:#5E9AD6; --rest:#1A2B3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A28; --surface:#152536; --ink:#E6EEF7; --soft:#9DB2C9;
  --blue:#6FA8E6; --deep:#A9CCF2; --sky:#1C3550; --line:#27405C;
  --water:#3B7CC0; --water2:#5E9AD6; --rest:#1A2B3D;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.serif{font-family:"Gowun Batang","Nanum Myeongjo",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--water2);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:20px 20px 40px}
.view{display:none}.view.on{display:block}

/* 홈 */
.hello{margin:8px 0 22px}
.hello small{display:block;color:var(--soft);font-size:14px}
.hello h1{margin:2px 0 0;font-size:26px;line-height:1.35;font-weight:700}

.vessel-wrap{display:flex;gap:18px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.vessel{width:96px;flex:none}
.vessel svg{display:block;width:100%;height:auto}
.stats p{margin:0}
.stats .big{font-family:"Gowun Batang",serif;font-size:34px;font-weight:700;line-height:1.1;color:var(--deep)}
.stats .sub{color:var(--soft);font-size:14px;margin-top:6px}
.stats .link{margin-top:10px;background:none;border:0;padding:0;color:var(--blue);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.today{margin-top:18px;background:var(--deep);color:#fff;border-radius:22px;padding:22px 22px 20px}
:root[data-theme="dark"] .today{color:#0E1A28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .today{color:#0E1A28}}
.today .date{font-size:14px;opacity:.8}
.today .passage{font-family:"Gowun Batang",serif;font-size:28px;line-height:1.3;margin:6px 0 16px;font-weight:700}
.today .row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px}
.btn-light{background:#fff;color:#163F73}
.btn-ghost{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn-ghost.done{background:rgba(255,255,255,.18)}
.together{margin:14px 0 0;font-size:14px;opacity:.9}

.week{margin-top:22px}
.week h2{font-size:16px;margin:0 0 10px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 0;text-align:center;font-size:13px}
.dayc b{display:block;font-size:16px}
.dayc.rest{background:var(--rest);color:var(--soft)}
.dayc.read{background:var(--sky);border-color:var(--blue)}
.dayc.now{outline:2px solid var(--blue);outline-offset:1px}
.dayc .dot{display:block;height:6px;width:6px;border-radius:50%;margin:4px auto 0;background:transparent}
.dayc.read .dot{background:var(--blue)}

/* 오늘 분량 화면 */
.top{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.back{background:none;border:0;padding:8px 10px 8px 0;font-size:15px;color:var(--blue);font-weight:500}
.dhead small{color:var(--soft);font-size:14px}
.dhead h1{font-family:"Gowun Batang",serif;font-size:28px;line-height:1.3;margin:2px 0 18px}

.teaser{position:relative;width:100%;aspect-ratio:1/1;border:0;padding:0;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,#1F5FA8,#163F73);color:#fff;text-align:left;display:block}
.teaser .inner{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.teaser .q{font-family:"Gowun Batang",serif;font-size:26px;line-height:1.45;font-weight:700}
.teaser .meta{font-size:12px;opacity:.75}
.teaser .hint{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.92);color:#163F73;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px}
.guide{display:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:0}
.guide.on{display:block}
.guide h3{font-family:"Gowun Batang",serif;font-size:20px;margin:0 0 8px}
.guide p{margin:0 0 10px}
.guide .file{font-size:13px;color:var(--soft)}
.guide p{line-height:1.8}
.guide .box{background:var(--sky);border-radius:14px;padding:14px 16px;margin:14px 0}
.guide .box b{display:block;font-size:14px;color:var(--deep);margin-bottom:4px}
.guide .box p{margin:0}
.teaser .q{font-size:23px}
.guide .close{background:none;border:0;color:var(--blue);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}

.yt{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.yt svg{flex:none}
.yt b{display:block;font-size:16px}
.yt span{font-size:13px;color:var(--soft)}

.check{margin-top:22px;width:100%;border:0;border-radius:18px;padding:18px;font-size:17px;font-weight:700;
  background:var(--blue);color:#fff;transition:background .2s}
:root[data-theme="dark"] .check{color:#0E1A28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .check{color:#0E1A28}}
.check.done{background:var(--sky);color:var(--deep)}
.note{font-size:13px;color:var(--soft);text-align:center;margin:10px 0 0}

.sunday{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.sunday h2{font-family:"Gowun Batang",serif;margin:0 0 6px;font-size:22px}
.sunday p{margin:0 0 14px;color:var(--soft)}

.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.cards canvas{flex:0 0 100%;width:100%;height:auto;aspect-ratio:1/1;scroll-snap-align:start;border-radius:20px;cursor:pointer;background:#F8F3F0}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.cardbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.cardbar button{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.sheet{position:fixed;inset:0;background:rgba(10,25,45,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.on{display:flex}
.sheet .in{background:var(--surface);width:100%;max-width:460px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:"Gowun Batang",serif;margin:0 0 4px;font-size:21px}
.sheet p{margin:0 0 14px;color:var(--soft);font-size:14px}
.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet figure{margin:0}.sheet img{width:100%;border-radius:10px;display:block}
.sheet figcaption{font-size:11px;color:var(--soft);margin-top:4px;word-break:break-all}
.capbox{margin-top:16px}
.caphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
.caphead button{background:none;border:0;color:var(--blue);font-weight:700;padding:6px 0}
.capbox textarea{width:100%;font:inherit;font-size:13px;line-height:1.6;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);color:var(--ink);resize:vertical}
.sheet .btn{margin-top:16px;width:100%;background:var(--blue);color:#fff;border-radius:14px;padding:14px}

/* 기록 화면 */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{margin:0;font-size:20px}
.calhead button{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:40px;height:40px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;color:var(--soft);text-align:center;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.cell.empty{border:0;background:none}
.cell.rest{background:var(--rest);color:var(--soft);border-color:transparent}
.cell.read{background:var(--blue);color:#fff;border-color:var(--blue)}
.cell.future{color:var(--soft);opacity:.6}
.cell.now{outline:2px solid var(--blue);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.recsum{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:15px}
.recsum p{margin:0 0 6px}.recsum p:last-child{margin:0;color:var(--soft);font-size:14px}

.proto{margin-top:30px;font-size:12px;color:var(--soft);text-align:center;line-height:1.5}

/* 이름 묻기 */
.ask{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ask.on{display:flex}
.ask form{background:var(--surface);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.ask h2{font-family:"Gowun Batang",serif;margin:0 0 6px;font-size:22px}
.ask p{margin:0 0 14px;color:var(--soft);font-size:14px}
.ask input{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.ask .btn{margin-top:12px;width:100%;background:var(--blue);color:#fff;border-radius:14px;padding:14px}

#water{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion: reduce){#water{transition:none}}
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <section class="view on" id="home" aria-label="홈">
    <header class="hello">
      <small id="greetTime">좋은 아침이에요</small>
      <h1 id="greetName">함께 읽어요</h1>
    </header>

    <div class="vessel-wrap">
      <div class="vessel" aria-hidden="true">
        <svg viewBox="0 0 100 130">
          <defs>
            <clipPath id="jar"><path d="M30 8 h40 v14 c0 6 14 10 18 26 c4 18 4 46 0 62 c-3 12 -14 16 -38 16 s-35 -4 -38 -16 c-4 -16 -4 -44 0 -62 c4 -16 18 -20 18 -26 z"/></clipPath>
          </defs>
          <g clip-path="url(#jar)">
            <rect x="0" y="0" width="100" height="130" fill="var(--sky)"/>
            <g id="water" style="transform:translateY(130px)">
              <path d="M0 4 q12 -6 25 0 t25 0 t25 0 t25 0 v130 h-100z" fill="var(--water2)" opacity=".7"/>
              <path d="M0 8 q12 -5 25 0 t25 0 t25 0 t25 0 v130 h-100z" fill="var(--water)"/>
            </g>
          </g>
          <path d="M30 8 h40 v14 c0 6 14 10 18 26 c4 18 4 46 0 62 c-3 12 -14 16 -38 16 s-35 -4 -38 -16 c-4 -16 -4 -44 0 -62 c4 -16 18 -20 18 -26 z" fill="none" stroke="var(--deep)" stroke-width="3"/>
        </svg>
      </div>
      <div class="stats">
        <p class="big" id="pct">0%</p>
        <p class="sub" id="chap">올해 1,189장 중 0장을 읽었어요</p>
        <button class="link" data-go="record">내 통독 기록 보기</button>
      </div>
    </div>

    <div class="today" id="todayBox"></div>

    <div class="week">
      <h2>이번 주</h2>
      <div class="strip" id="strip"></div>
    </div>

    <p class="proto">코디엠교회 마중물 성경통독</p>
  </section>

  <!-- 하루 화면 -->
  <section class="view" id="day" aria-label="오늘 분량">
    <div class="top"><button class="back" data-go="home">‹ 처음으로</button></div>
    <div id="dayBody"></div>
  </section>

  <!-- 기록 -->
  <section class="view" id="record" aria-label="내 통독 기록">
    <div class="top"><button class="back" data-go="home">‹ 처음으로</button></div>
    <div class="calhead">
      <button id="prevM" aria-label="이전 달">‹</button>
      <h2 id="mTitle"></h2>
      <button id="nextM" aria-label="다음 달">›</button>
    </div>
    <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>읽은 날</span>
      <span><i style="border:1px solid var(--line);background:var(--surface)"></i>아직 읽지 않은 날</span>
      <span><i style="background:var(--rest)"></i>쉬는 날</span>
    </div>
    <div class="recsum" id="recsum"></div>
  </section>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="카드 이미지 저장">
  <div class="in">
    <h2>티저 카드 이미지</h2>
    <p>이미지를 길게 누르거나(휴대폰) 오른쪽 클릭해서(컴퓨터) 저장하세요. 인스타그램에 올리는 카드와 같은 1080×1080 원본이에요.</p>
    <div class="grid" id="sheetGrid"></div>
    <div id="capBox" class="capbox">
      <div class="caphead"><b>인스타그램 캡션</b><button id="capCopy">캡션 복사</button></div>
      <textarea id="capText" rows="9" readonly></textarea>
    </div>
    <button class="btn" id="sheetClose">닫기</button>
  </div>
</div>

<div class="ask" id="ask">
  <form id="askForm">
    <h2>반가워요</h2>
    <p>어떻게 불러드릴까요? 이 이름은 이 휴대폰에만 저장돼요.</p>
    <input id="nameIn" maxlength="12" placeholder="예: 김코디" autocomplete="name" required>
    <button class="btn" type="submit">시작하기</button>
  </form>
</div>

<script>
/* ---------- 예시 통독표: 실제 통독표 CSV로 교체 예정 ---------- */
const BOOKS=[["창세기",50],["출애굽기",40],["레위기",27],["민수기",36],["신명기",34],["여호수아",24],["사사기",21],["룻기",4],["사무엘상",31],["사무엘하",24],["열왕기상",22],["열왕기하",25],["역대상",29],["역대하",36],["에스라",10],["느헤미야",13],["에스더",10],["욥기",42],["시편",150],["잠언",31],["전도서",12],["아가",8],["이사야",66],["예레미야",52],["예레미야애가",5],["에스겔",48],["다니엘",12],["호세아",14],["요엘",3],["아모스",9],["오바댜",1],["요나",4],["미가",7],["나훔",3],["하박국",3],["스바냐",3],["학개",2],["스가랴",14],["말라기",4],["마태복음",28],["마가복음",16],["누가복음",24],["요한복음",21],["사도행전",28],["로마서",16],["고린도전서",16],["고린도후서",13],["갈라디아서",6],["에베소서",6],["빌립보서",4],["골로새서",4],["데살로니가전서",5],["데살로니가후서",3],["디모데전서",6],["디모데후서",4],["디도서",3],["빌레몬서",1],["히브리서",13],["야고보서",5],["베드로전서",5],["베드로후서",3],["요한일서",5],["요한이서",1],["요한삼서",1],["유다서",1],["요한계시록",22]];
const CH=[];BOOKS.forEach(([b,n])=>{for(let i=1;i<=n;i++)CH.push([b,i])});
const TOTAL=CH.length;
const YOUTUBE="https://www.youtube.com/@kodiamtv";
const WD=["일","월","화","수","목","금","토"];

const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const today=new Date();today.setHours(0,0,0,0);
const YEAR=today.getFullYear();

/* ===== 설정: 구글 시트 "웹에 게시(CSV)" 주소를 여기에 넣으세요 ===== */

function countCh(t){let n=0;t.split(",").forEach(p=>{const m=p.match(/(\d+)\s*(?:[-–]\s*(\d+))?\s*장/);if(m)n+=m[2]?(+m[2]-+m[1]+1):1});return n}

const PLAN={};let READING=[];
function buildPlan(rows){
  Object.keys(PLAN).forEach(k=>delete PLAN[k]);
  rows.forEach(r=>{if(!r||!r.bible||!r.date)return;const [m,d]=String(r.date).trim().split(".").map(Number);if(!m||!d)return;
    r.prayer=(r.prayer||"").replace(/^•\s*/,"");
    PLAN[`${YEAR}-${pad(m)}-${pad(d)}`]={...r,label:r.bible.replace(/(\d)-(\d)/g,"$1–$2"),count:countCh(r.bible)}});
  READING=Object.keys(PLAN).sort();
}
function parseCSV(t){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);out.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);out.push(row)}
  const h=out.shift().map(x=>x.trim().replace(/^\uFEFF/,""));
  return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}

    box.innerHTML=`<div class="date">${fmt(today)}</div>
      <div class="passage">오늘은 통독을 쉬는 날이에요</div>
      <div class="row"><button class="btn btn-light" data-open="${k}">한 주의 질문과 답 보기</button></div>`;
    return;
  }
  const done=read.has(k);
  box.innerHTML=`<div class="date">${fmt(today)} 오늘의 본문</div>
    <div class="passage">${p.label}</div>
    <p class="together" style="margin:-8px 0 16px">${esc(p.title)}</p>
    <div class="row">
      <button class="btn btn-light" data-open="${k}">오늘 분량 보기</button>
      <button class="btn btn-ghost ${done?"done":""}" data-toggle="${k}">${done?"읽었어요 ✓":"다 읽었어요"}</button>
    </div>
    ${!done&&hasMissed()?`<p class="together">지난 날은 그대로 두셔도 괜찮아요. 오늘 본문부터 함께 읽어요.</p>`:""}`;
}
function hasMissed(){const k=key(today);return READING.some(r=>r<k&&!read.has(r))}
function renderStrip(){
  const s=document.getElementById("strip"),start=new Date(today);start.setDate(today.getDate()-today.getDay());
  let h="";
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d);
    const cls=["dayc",d.getDay()===0?"rest":"",read.has(k)?"read":"",k===key(today)?"now":""].join(" ");
    h+=`<button class="${cls}" data-open="${k}" aria-label="${fmt(d)}${read.has(k)?", 읽음":""}">${WD[d.getDay()]}<b>${d.getDate()}</b><span class="dot"></span></button>`}
  s.innerHTML=h;
}
function renderHome(){greet();progress();renderToday();renderStrip()}

/* ---------- 하루 화면 ---------- */
function openDay(k){
  const d=fromKey(k),p=PLAN[k],body=document.getElementById("dayBody");
  if(!p&&d.getDay()!==0){
    body.innerHTML=`<div class="dhead"><small>${fmt(d)}</small><h1>통독 자료 준비 중</h1></div>
      <div class="sunday"><p>이 날의 통독 가이드가 아직 등록되지 않았어요.</p></div>`;
    show("day");return;
  }
  if(!p){
    body.innerHTML=`<div class="dhead"><small>${fmt(d)}</small><h1>쉼의 날</h1></div>
      <div class="sunday"><h2>한 주의 질문과 답</h2>
      <p>이번 주 성도들이 남긴 질문에 하임레시피 특별판으로 답해요.</p>
      ${ytLink("하임레시피 특별판 듣기","유튜브에서 열려요")}</div>`;
  }else{
    const done=read.has(k);
    body.innerHTML=`<div class="dhead"><small>${fmt(d)}</small><h1>${p.label}</h1></div>
      <div class="cards" id="cards" aria-label="티저 카드 4장, 옆으로 넘겨 보세요"></div>
      <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>
      <div class="cardbar" id="cardbar"><span>카드를 누르면 통독 가이드가 열려요</span><button id="saveCards">카드 이미지 저장</button></div>
      <div class="guide" id="guide">
        <small class="file">${p.label} 통독 가이드</small>
        <h3>${esc(p.title)}</h3>
        ${[p.word_1,p.word_2,p.word_3].filter(Boolean).map(w=>`<p>${esc(w)}</p>`).join("")}
        <div class="box"><b>생각해 볼 질문</b><p>${esc(p.think)}</p></div>
        <div class="box"><b>함께 드리는 기도</b><p>${esc(p.prayer)}</p></div>
        <button class="close" id="closeGuide">티저 카드 다시 보기</button>
      </div>
      ${ytLink("하임레시피 듣기","오늘 본문 방송이 유튜브에서 열려요")}
      <button class="check ${done?"done":""}" data-toggle="${k}">${done?"읽었어요 ✓ (다시 누르면 취소)":"성경 본문을 다 읽었어요"}</button>
      <p class="note">가이드와 방송은 읽기를 돕는 길잡이예요. 진도에는 본문 읽기만 기록돼요.</p>`;
    const cards=document.getElementById("cards"),g=document.getElementById("guide"),bar=document.getElementById("cardbar"),dots=document.getElementById("dots");
    drawCards(p,cards);
    cards.onclick=()=>{cards.style.display=dots.style.display=bar.style.display="none";g.classList.add("on");document.getElementById("closeGuide").focus()};
    cards.onscroll=()=>{const i=Math.round(cards.scrollLeft/cards.clientWidth);dots.querySelectorAll("i").forEach((d,j)=>d.classList.toggle("on",i===j))};
    document.getElementById("closeGuide").onclick=()=>{g.classList.remove("on");cards.style.display="flex";dots.style.display="flex";bar.style.display="flex"};
    document.getElementById("saveCards").onclick=()=>openSheet(k,cards);
  }
  show("day");
}
function ytLink(t,s){return `<a class="yt" href="${YOUTUBE}" target="_blank" rel="noopener">
  <svg width="40" height="28" viewBox="0 0 40 28" aria-hidden="true"><rect width="40" height="28" rx="8" fill="#E33"/><path d="M16 8l10 6-10 6z" fill="#fff"/></svg>
  <span><b>${t}</b><span>${s}</span></span></a>`}

/* ---------- 티저 카드: 하임레시피 티저 카드 양식을 그대로 옮김 ---------- */
const NAVY="#0A4DA8",CREAM="#F8F3F0",SOFT="#8FB2DC",LINE="#E2D8D2",FOOT="#9A8C86",RULED="#2E69B8";
const SANS="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif",SERIF="'Noto Serif KR', 'Nanum Myeongjo', serif";
function wrapT(c,t,mw){const L=[];let cur="";for(const ch of t){if(ch==="\n"){L.push(cur);cur="";continue}const n=cur+ch;if(c.measureText(n).width>mw&&cur){L.push(cur);cur=ch.trimStart()}else cur=n}if(cur)L.push(cur);return L}
function block(c,t,font,x,y,mw,lh,fill){c.font=font;c.fillStyle=fill;for(const ln of wrapT(c,t,mw)){c.fillText(ln,x,y);y+=lh}return y}
function rule(c,x1,y1,x2,y2,col,w){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function frame(c,bg,ln){c.fillStyle=bg;c.fillRect(0,0,1080,1080);c.strokeStyle=ln;c.lineWidth=2;c.strokeRect(55,55,970,970);c.textBaseline="top"}
const head=ep=>`코디엠 성경통독 · 하임레시피${ep?" "+ep:""}`;
function hook(c,ep,no,q,tw,dark){
  const [bg,fg,acc,ln,foot]=dark?[NAVY,CREAM,SOFT,RULED,SOFT]:[CREAM,NAVY,NAVY,LINE,FOOT];
  frame(c,bg,ln);
  c.font=`400 26px ${SANS}`;c.fillStyle=dark?SOFT:FOOT;c.fillText(head(ep),120,140);
  c.font=`300 72px ${SANS}`;c.fillStyle=dark?"#145CBE":acc;c.fillText(`Q${no}`,118,212);
  let y=block(c,q,`700 80px ${SERIF}`,120,420,840,104,fg);
  rule(c,120,y+44,240,y+44,dark?CREAM:acc,3);y+=104;
  block(c,tw,`700 44px ${SERIF}`,120,y,840,66,dark?CREAM:acc);
  rule(c,120,970,960,970,ln,2);
  c.font=`400 22px ${SANS}`;c.fillStyle=foot;c.fillText("코디엠 성경통독  @kodiam_bible",120,992);
}
function outro(c,ep,bible,l1,l2,when="매일 새벽 5시 30분"){
  frame(c,NAVY,RULED);
  c.font=`400 26px ${SANS}`;c.fillStyle=SOFT;c.fillText(head(ep),120,140);
  rule(c,120,420,240,420,CREAM,3);
  c.font=`700 72px ${SERIF}`;c.fillStyle=CREAM;c.fillText(l1,120,478);c.fillText(l2,120,574);
  rule(c,120,830,960,830,RULED,2);
  c.font=`400 28px ${SANS}`;c.fillStyle=CREAM;c.fillText(`하임 레시피  ·  ${when}`,120,868);
  c.font=`400 26px ${SANS}`;c.fillStyle=SOFT;c.fillText(`오늘 본문  ${bible}`,120,914);
  c.font=`400 22px ${SANS}`;c.fillText("코디엠 성경통독  @kodiam_bible",120,978);
}
const br=t=>(t||"").replace(/\|/g,"\n");
async function drawCards(p,box){
  const qs=[[p.q1,p.t1],[p.q2,p.t2],[p.q3,p.t3]],bible=p.bible.replace(/(\d)-(\d)/g,"$1~$2");
  const all=qs.flat().join("")+p.outro1+p.outro2+bible+"코디엠 성경통독하임레시피Q123@kodiam_bible매일새벽5시30분오늘본문";
  try{await Promise.all([document.fonts.load(`700 80px 'Noto Serif KR'`,all),document.fonts.load(`300 72px 'Noto Sans KR'`,"Q123"),document.fonts.load(`400 26px 'Noto Sans KR'`,all)])}catch(e){}
  box.innerHTML="";
  qs.forEach(([q,t],i)=>{const cv=document.createElement("canvas");cv.width=cv.height=1080;cv.setAttribute("aria-label",`Q${i+1} ${(q||"").replace(/\|/g," ")}`);hook(cv.getContext("2d"),p.ep,i+1,br(q),t||"",i===0);box.appendChild(cv)});
  const cv=document.createElement("canvas");cv.width=cv.height=1080;cv.setAttribute("aria-label",`${p.outro1} ${p.outro2}`);outro(cv.getContext("2d"),p.ep,bible,p.outro1||"",p.outro2||"");box.appendChild(cv);
}
function openSheet(k,box){
  const grid=document.getElementById("sheetGrid");grid.innerHTML="";
  box.querySelectorAll("canvas").forEach((cv,i)=>{const f=document.createElement("figure");const im=new Image();im.src=cv.toDataURL("image/png");im.alt=`티저 카드 ${i+1}`;
    const cap=document.createElement("figcaption");cap.textContent=`${k}_${i+1}.png`;f.append(im,cap);grid.appendChild(f)});
  const p=PLAN[k],cap=document.getElementById("capBox"),ta=document.getElementById("capText");
  /* 캡션: 띄어 쓴 " | "는 구분 기호로 두고, 붙여 쓴 "|"만 줄바꿈 */
  const text=p&&p.caption?p.caption.replace(/ \| /g,"\u0000").replace(/\|/g,"\n").replace(/\u0000/g," | "):"";
  cap.style.display=text?"block":"none";ta.value=text;
  document.getElementById("capCopy").textContent="캡션 복사";
  document.getElementById("sheet").classList.add("on");
}
document.getElementById("capCopy").onclick=async()=>{const ta=document.getElementById("capText"),b=document.getElementById("capCopy");
  try{await navigator.clipboard.writeText(ta.value);b.textContent="복사했어요"}catch(e){ta.select();try{document.execCommand("copy");b.textContent="복사했어요"}catch(_){b.textContent="길게 눌러 복사해 주세요"}}};
document.getElementById("sheetClose").onclick=()=>document.getElementById("sheet").classList.remove("on");

/* ---------- 기록 ---------- */
let viewM=today.getMonth();
function renderCal(){
  const first=new Date(YEAR,viewM,1),days=new Date(YEAR,viewM+1,0).getDate();
  document.getElementById("mTitle").textContent=`${YEAR}년 ${viewM+1}월`;
  let h="";for(let i=0;i<first.getDay();i++)h+=`<span class="cell empty"></span>`;
  for(let n=1;n<=days;n++){const d=new Date(YEAR,viewM,n),k=key(d);
    const c=["cell",d.getDay()===0?"rest":"",read.has(k)?"read":"",(d>today||(!PLAN[k]&&d.getDay()!==0))?"future":"",k===key(today)?"now":""].join(" ");
    h+=`<button class="${c}" data-open="${k}" aria-label="${fmt(d)}${read.has(k)?", 읽음":""}">${n}</button>`}
  document.getElementById("cal").innerHTML=h;
  document.getElementById("prevM").disabled=viewM===0;document.getElementById("nextM").disabled=viewM===11;
  const k=key(today),past=READING.filter(r=>r<=k).length,f=fromKey(READING[0]),l=fromKey(READING[READING.length-1]);let days2=0;read.forEach(r=>{if(PLAN[r])days2++});
  document.getElementById("recsum").innerHTML=`<p>지금까지 통독한 날 ${days2}일</p><p>날짜를 누르면 그날 본문을 열고, 원하실 때 놓친 날을 채울 수 있어요. 지금 등록된 통독 자료는 ${f.getMonth()+1}월 ${f.getDate()}일부터 ${l.getMonth()+1}월 ${l.getDate()}일까지예요.</p>`;
}

/* ---------- 공통 ---------- */
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));window.scrollTo(0,0);if(id==="home")renderHome();if(id==="record")renderCal()}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"),g=e.target.closest("[data-go]"),t=e.target.closest("[data-toggle]");
  if(t){const k=t.dataset.toggle;read.has(k)?read.delete(k):read.add(k);save("kodiam-read",[...read]);
    if(document.getElementById("day").classList.contains("on"))openDay(k);else renderHome();return}
  if(o){openDay(o.dataset.open);return}
  if(g){show(g.dataset.go)}
});
document.getElementById("prevM").onclick=()=>{if(viewM>0){viewM--;renderCal()}};
document.getElementById("nextM").onclick=()=>{if(viewM<11){viewM++;renderCal()}};
document.getElementById("askForm").onsubmit=e=>{e.preventDefault();name=document.getElementById("nameIn").value.trim();save("kodiam-name",name);document.getElementById("ask").classList.remove("on");greet()};
if(!name){document.getElementById("ask").classList.add("on");setTimeout(()=>document.getElementById("nameIn").focus(),100)}
renderHome();
if(SHEET_URL){fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"})
  .then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{const rows=parseCSV(t);if(rows.length){buildPlan(rows);if(document.getElementById("home").classList.contains("on"))renderHome()}})
  .catch(()=>{})}
</script>
