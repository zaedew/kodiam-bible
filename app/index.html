<style>
:root{
  --paper:#F6F9FC; --surface:#FFFFFF; --ink:#132C48; --soft:#5A7390;
  --blue:#1F5FA8; --deep:#163F73; --sky:#DCE8F6; --line:#CFDCEB;
  --water:#3E86CF; --water2:#7FB2E5; --rest:#EEF2F7;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A28; --surface:#152536; --ink:#E6EEF7; --soft:#9DB2C9;
    --blue:#6FA8E6; --deep:#A9CCF2; --sky:#1C3550; --line:#27405C;
    --water:#3B7CC0; --water2:#5E9AD6; --rest:#1A2B3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A28; --surface:#152536; --ink:#E6EEF7; --soft:#9DB2C9;
  --blue:#6FA8E6; --deep:#A9CCF2; --sky:#1C3550; --line:#27405C;
  --water:#3B7CC0; --water2:#5E9AD6; --rest:#1A2B3D;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.serif{font-family:"Gowun Batang","Nanum Myeongjo",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--water2);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:20px 20px 40px}
.view{display:none}.view.on{display:block}

/* 홈 */
.hello{margin:8px 0 22px;display:flex;justify-content:space-between;align-items:flex-start}
.hello small{display:block;color:var(--soft);font-size:14px}
.hello h1{margin:2px 0 0;font-size:26px;line-height:1.35;font-weight:700}
.auth-wrap{flex:none;margin-top:4px}
.auth-btn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--blue)}
.auth-profile{display:none;align-items:center;gap:8px;font-size:13px}
.auth-profile b{color:var(--ink);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
